<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noelle — Ödeme</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body>

  <header class="checkout-header">
    <div class="checkout-header-container">
      <a href="../index.html" class="checkout-logo">
        <strong>NOELLE</strong> <span>ÖDEME</span>
      </a>

      <a href="cart.html" class="continue-shopping">
        Göz Atmaya Devam Et
      </a>
    </div>
  </header>

  <main class="checkout-page">

    <section class="checkout-left">
      <div class="checkout-error-box">
        <i class="fa-regular fa-circle-xmark"></i>
        <h1>Online ödeme kabul edemiyoruz</h1>
        <p>Siparişinizle ilgili yardım için bizimle iletişime geçin.</p>
      </div>
    </section>

    <aside class="checkout-summary">
      <div class="checkout-summary-header">
        <h2>Sipariş Özeti <span id="checkoutCount">(0 öğe)</span></h2>
        <i class="fa-regular fa-pen-to-square"></i>
      </div>

      <div class="checkout-items" id="checkoutItems">
        <!-- ürünler JS ile gelecek -->
      </div>

      <div class="checkout-promo">
        <i class="fa-solid fa-tag"></i>
        <span>Bir promosyon kodu girin</span>
      </div>

      <div class="checkout-totals">
        <div class="checkout-total-row">
          <span>Ara Toplam</span>
          <span id="checkoutSubtotal">₺0,00</span>
        </div>

        <div class="checkout-total-row">
          <span>Kargo</span>
          <span>--</span>
        </div>

        <div class="checkout-total-row checkout-final-total">
          <span>Toplam</span>
          <span id="checkoutTotal">₺0,00</span>
        </div>
      </div>
    </aside>

  </main>

  <footer class="checkout-footer">
    <p>
      <i class="fa-solid fa-lock"></i>
      Güvenli Ödeme
    </p>
  </footer>

  <div class="chat-widget">
    <div class="chat-box" id="chatBox">
      <div class="chat-box-header">
        <span>Noelle</span>
        <i class="fa-solid fa-x" id="chatClose"></i>
      </div>
      <div class="chat-box-body">
        <p>Merhaba! Size nasıl yardımcı olabiliriz?</p>
      </div>
      <div class="chat-box-input">
        <input type="text" placeholder="Mesajınızı yazın...">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
    </div>

    <button class="chat-btn" id="chatBtn">
      <i class="fa-solid fa-comment"></i> Sohbet Edelim!
    </button>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
